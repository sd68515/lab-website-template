<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A reusable research website template with illustrative data." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:," />
    <title>Research Project Template</title>
    <script>
      try {
        const stored = localStorage.getItem('lab-template.theme');
        const theme = stored === 'light' || stored === 'dark' ? stored : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = theme === 'dark' ? '#141C27' : '#FFFFFF';
      } catch (_) { /* Storage can be unavailable; the app still works. */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This template needs JavaScript. / 此模板需要启用 JavaScript。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
